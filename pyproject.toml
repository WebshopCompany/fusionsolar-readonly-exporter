[project]
name = "fusionsolar-readonly-exporter"
version = "0.1.0"
description = "Strictly read-only Huawei FusionSolar owner-account telemetry exporter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "WebshopCompany contributors" }]
dependencies = [
  "fusion-solar-py==0.1.2",
  "requests>=2.32,<3",
  "pyarrow>=25.0.1,<26",
  "tzdata; sys_platform == 'win32'",
]

[project.scripts]
fusionsolar-export = "fusionsolar_readonly_exporter.cli:main"
fusionsolar-stage1 = "fusionsolar_readonly_exporter.stage1:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.13,<0.14",
  "pyright>=1.1.405,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusionsolar_readonly_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.uv]
required-version = ">=0.12.18,<0.13"

[tool.fusionsolar-readonly-exporter]
upstream-fusionsolarpy-commit = "3e02b9f5d831673070e0f7ddac7d9db53ca2368b"
