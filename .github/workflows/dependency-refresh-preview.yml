name: dependency-refresh-preview

on:
  push:
    branches:
      - 'action/**'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
      - name: Refresh lock
        run: uv lock
      - name: Apply repository formatter
        run: uv run ruff format tests/test_stage1.py
      - name: Upload generated repair inputs
        uses: actions/upload-artifact@v4
        with:
          name: generated-repair-inputs
          path: |
            uv.lock
            tests/test_stage1.py
          if-no-files-found: error
