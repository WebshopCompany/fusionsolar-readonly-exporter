name: candidate-bootstrap

on:
  push:
    branches:
      - 'feature/initial-readonly-exporter'

permissions:
  contents: write

jobs:
  materialise-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.18'
      - name: Resolve and verify lock
        run: |
          uv lock
          uv sync --frozen
      - name: Verify repository formatting
        run: uv run ruff format --check .
      - name: Commit generated lock
        run: |
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock is already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add uv dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
