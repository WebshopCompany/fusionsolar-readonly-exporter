name: candidate-ci

on:
  push:
    branches:
      - 'feature/**'
      - 'action/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.18'
      - name: Verify lock freshness
        run: uv lock --check
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Unit, integration and synthetic tests
        run: uv run pytest
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Public-context and privacy scan
        run: uv run pytest -q tests/test_public_context_hygiene.py tests/test_secret_hygiene.py
      - name: Read-only policy validation
        run: uv run pytest -q tests/test_readonly_policy.py tests/test_transport_retries.py
      - name: Build package
        run: uv build
      - name: Install wheel into clean smoke environment
        run: |
          uv venv .wheel-smoke --python ${{ matrix.python-version }}
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
      - name: Installed-wheel CLI smoke test
        run: .wheel-smoke/bin/fusionsolar-export --help
      - name: Installed-wheel Stage-1 CLI smoke test
        run: .wheel-smoke/bin/fusionsolar-stage1 --help

  stage1-posix-smoke:
    name: Stage-1 setup smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install supported uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
      - name: Exercise POSIX owner setup
        run: ./setup.sh
      - name: Exercise POSIX Stage-1 launcher
        run: ./run.sh --help

  stage1-windows-smoke:
    name: Stage-1 setup smoke (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install supported uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.19'
      - name: Exercise Windows owner setup
        shell: pwsh
        run: .\setup.ps1
      - name: Exercise Windows Stage-1 launcher
        shell: pwsh
        run: .\run.ps1 --help
